name: Build Android APK & AAB (Capacitor)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Build Variant'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - debug_only
          - release_only
      create_release:
        description: 'Publish direct download assets to GitHub Release'
        required: true
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup Node.js (with npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ⚡ Cache Vite Transform Cache
        uses: actions/cache@v4
        with:
          path: node_modules/.vite
          key: ${{ runner.os }}-vite-${{ hashFiles('**/package-lock.json', 'src/**', 'index.html', 'vite.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-vite-

      - name: 📦 Install Node Dependencies
        run: npm ci

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Cache Android Intermediate Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/build-cache
            ~/.android/cache
          key: ${{ runner.os }}-android-cache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-android-cache-

      - name: 🐘 Setup Gradle (with build, wrapper & dependency caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' && github.event_name == 'pull_request' }}
          add-job-summary-as-pr-comment: false

      - name: 🔨 Build Web Application
        run: npm run build

      - name: 🔄 Sync Capacitor Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 🛠️ Ensure Gradle Executable Permission
        run: chmod +x android/gradlew

      - name: 📱 Build Debug APK & AAB
        if: ${{ github.event.inputs.build_variant == 'all' || github.event.inputs.build_variant == 'debug_only' || github.event_name == 'push' || github.event_name == 'pull_request' }}
        run: |
          cd android
          ./gradlew assembleDebug bundleDebug --build-cache --parallel

      - name: 📱 Build Release APK & AAB
        if: ${{ github.event.inputs.build_variant == 'all' || github.event.inputs.build_variant == 'release_only' }}
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease --build-cache --parallel

      - name: 📂 Prepare Direct Download Binaries
        id: prepare_bins
        run: |
          mkdir -p release_assets
          
          # Copy APK files with descriptive names
          find android/app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} release_assets/money-manager-debug.apk \; 2>/dev/null || true
          find android/app/build/outputs/apk/release/ -name "*.apk" -exec cp {} release_assets/money-manager-release-unsigned.apk \; 2>/dev/null || true
          
          # Copy AAB (App Bundle) files with descriptive names
          find android/app/build/outputs/bundle/debug/ -name "*.aab" -exec cp {} release_assets/money-manager-debug.aab \; 2>/dev/null || true
          find android/app/build/outputs/bundle/release/ -name "*.aab" -exec cp {} release_assets/money-manager-release.aab \; 2>/dev/null || true

          echo "=== Ready Direct Download Files ==="
          ls -lh release_assets/

      - name: 🚀 Publish Direct Download Binaries to GitHub Release
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true' || github.event.inputs.create_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'continuous-build' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Release {0}', github.ref_name) || 'Continuous Android Build (Latest APK & AAB)' }}
          body: |
            ### 📱 Direct Download Mobile Binaries
            Directly download the `.apk` and `.aab` files below without unzipping:
            
            - **Direct APK (Debug)**: `money-manager-debug.apk` (Install & test directly on Android devices)
            - **Direct AAB (Bundle)**: `money-manager-debug.aab` / `money-manager-release.aab` (Google Play Console)
            
            **Commit**: `${{ github.sha }}`
            **Run**: `${{ github.run_number }}`
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📤 Upload Workflow Artifacts (Zip Backup)
        uses: actions/upload-artifact@v4
        with:
          name: expense-tracker-binaries
          path: release_assets/*
          retention-days: 30

      - name: 📋 Generate Step Summary
        run: |
          echo "## 📱 Android Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 Direct Download Binaries (.apk & .aab)" >> $GITHUB_STEP_SUMMARY
          echo "GitHub Releases provides raw, direct downloads of the binary files without wrapping them in \`.zip\`:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Direct Download Page**: [View GitHub Releases / Continuous Build](../../releases)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Generated Files" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -lh release_assets/ >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
